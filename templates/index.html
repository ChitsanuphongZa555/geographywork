<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Landmarks</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            padding: 16px 24px;
            display: flex;
            justify-content: center;
        }

        .navbar span {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .hero {
            text-align: center;
            padding: 30px 24px 24px 24px;
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #1d1d1f 0%, #6e6e73 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .map-wrapper {
            max-width: 1300px;
            margin: 0 auto 100px auto;
            padding: 0 24px;
        }

        .map-card {
            background: white;
            border-radius: 28px;
            padding: 8px;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.04),
                0 12px 40px rgba(0,0,0,0.08);
        }

        #map {
            height: 650px;
            border-radius: 22px;
            overflow: hidden;
        }

        /* Tooltip แบบ Apple */
        .leaflet-tooltip {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            padding: 0;
            opacity: 1;
        }

        .leaflet-tooltip-bottom:before,
        .leaflet-tooltip-top:before,
        .leaflet-tooltip-left:before,
        .leaflet-tooltip-right:before {
            display: none;
        }

        .tooltip-content {
            width: 160px;
        }

        .tooltip-content img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            display: block;
            border-radius: 12px 12px 0 0;
        }

        .tooltip-content .tooltip-text {
            padding: 8px 10px 10px 10px;
        }

        .tooltip-content h3 {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 2px;
            line-height: 1.3;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .tooltip-content .name-th {
            font-size: 11px;
            color: #6e6e73;
            margin-bottom: 4px;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .tooltip-content .country {
            font-size: 10px;
            color: #0071e3;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .tooltip-content .coords {
            font-size: 9px;
            color: #86868b;
            font-family: 'SF Mono', Monaco, monospace;
        }

        .footer {
            text-align: center;
            padding: 30px 24px;
            color: #86868b;
            font-size: 12px;
            border-top: 1px solid rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <div class="navbar">
        <span>🌍 Landmarks</span>
    </div>

    <div class="hero">
        <h1>Explore the World</h1>
    </div>

    <div class="map-wrapper">
        <div class="map-card">
            <div id="map"></div>
        </div>
    </div>

    <div class="footer">
        Made with Flask &amp; Leaflet
    </div>

    <script>
        const map = L.map('map', {
            zoomControl: true,
            dragging: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            touchZoom: false,
            boxZoom: false,
            keyboard: false
        }).setView([20, 20], 3);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const places = {{ places | tojson }};

        function formatDD(lat, lng) {
            const latDir = lat >= 0 ? 'N' : 'S';
            const lngDir = lng >= 0 ? 'E' : 'W';
            const latVal = Math.abs(lat).toFixed(4);
            const lngVal = Math.abs(lng).toFixed(4);
            return `${latVal}° ${latDir}, ${lngVal}° ${lngDir}`;
        }

        // คำนวณทิศทางที่การ์ดควรโผล่ ให้ไม่โดนตัดขาดโดยขอบแผนที่
        function getTooltipOptions(marker) {
            const point = map.latLngToContainerPoint(marker.getLatLng());
            const size = map.getSize();

            let direction = 'bottom';
            let offset = [0, 10];

            if (point.y > size.y * 0.65) {
                direction = 'top';
                offset = [0, -10];
            }
            if (point.x > size.x * 0.8) {
                direction = 'left';
                offset = [-10, 0];
            } else if (point.x < size.x * 0.2) {
                direction = 'right';
                offset = [10, 0];
            }

            return { direction, offset };
        }

        places.forEach(place => {
            const marker = L.marker([place.lat, place.lng]).addTo(map);

            const html = `
                <div class="tooltip-content">
                    <img src="${place.image}" alt="${place.name}">
                    <div class="tooltip-text">
                        <h3>${place.name}</h3>
                        <div class="name-th">${place.name_th}</div>
                        <div class="country">${place.province}</div>
                        <div class="coords">📍 ${formatDD(place.lat, place.lng)}</div>
                    </div>
                </div>
            `;

            const { direction, offset } = getTooltipOptions(marker);

            marker.bindTooltip(html, {
                direction: direction,
                offset: offset,
                opacity: 1,
                sticky: false
            });
        });
    </script>
</body>
</html>
