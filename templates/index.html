<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แลนด์มาร์กทั่วโลก</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        #map {
            max-width: 1100px;
            height: 420px;
            margin: 0 auto 40px auto;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            z-index: 1;
        }

        .popup-content {
            text-align: center;
        }

        .popup-content img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 6px;
        }

        .popup-content h3 {
            font-size: 15px;
            color: #185a9d;
            margin-bottom: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.25);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
        }

        .card-body h2 {
            font-size: 20px;
            color: #185a9d;
            margin-bottom: 6px;
        }

        .province {
            display: inline-block;
            font-size: 13px;
            color: #43cea2;
            background: #e6f9f4;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .card-body p {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌍 แลนด์มาร์กทั่วโลก</h1>
        <p>รวมสถานที่ท่องเที่ยวและแลนด์มาร์กชื่อดังทั่วโลก — กดหมุดบนแผนที่เพื่อดูรายละเอียด</p>
    </div>

    <div id="map"></div>

    <div class="grid">
        {% for place in places %}
        <div class="card">
            <img src="{{ place.image }}" alt="{{ place.name }}">
            <div class="card-body">
                <h2>{{ place.name }}</h2>
                <span class="province">📍 {{ place.province }}</span>
                <p>{{ place.description }}</p>
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        const map = L.map('map').setView([20, 20], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const places = {{ places | tojson }};

        places.forEach(place => {
            const marker = L.marker([place.lat, place.lng]).addTo(map);
            marker.bindPopup(`
                <div class="popup-content">
                    <img src="${place.image}" alt="${place.name}">
                    <h3>${place.name}</h3>
                    <p>${place.province}</p>
                </div>
            `);
        });
    </script>
</body>
</html>
